services:
  frontend:
    build: ./frontend
    ports: ["3000:3000"]
    environment:
      API_URL: http://backend:3000
    depends_on: [backend]
  backend:
    build: ./backend
    ports: ["3001:3000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trial
      POSTGRES_DB: trial
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
  tests:
    image: alpine:3.21
    profiles: [test]
    command: ["false"]
volumes:
  pgdata:
